<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Web Chat Localhost</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="app-header">
      <h1>Web Chat</h1>
      <div id="userInfo" class="user-info" style="display:none">
        <span id="usernameLabel"></span>
        <button id="btnLogout" class="btn small">Đăng xuất</button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="app-main">
      <!-- Auth Section (shown when not logged in) -->
      <section id="authSection" class="auth-section">
        <div class="auth-card">
          <h2>Đăng nhập / Đăng ký</h2>
          <div class="form-group">
            <label for="inputUsername">Tên đăng nhập</label>
            <input id="inputUsername" placeholder="Tên của bạn" />
          </div>
          <div class="form-group">
            <label for="inputPassword">Mật khẩu</label>
            <input id="inputPassword" type="password" placeholder="Password" />
          </div>
          <div class="button-row">
            <button id="btnLogin" class="btn primary">Đăng nhập</button>
            <button id="btnRegister" class="btn">Đăng ký</button>
          </div>
          <div id="authMessage" class="message"></div>
        </div>
      </section>

      <!-- Chat Section (shown when logged in) -->
      <section id="chatMainSection" class="chat-main" style="display:none">
        <!-- Left Sidebar: Chat List (Messenger-style) -->
        <aside class="chat-sidebar">
          <!-- Search bar -->
          <div class="chat-sidebar-search">
            <input id="searchChat" placeholder="🔍 Tìm cuộc trò chuyện..." />
          </div>

          <!-- Chat List -->
          <div class="chat-list">
            <!-- Common room -->
            <div class="chat-list-item active" data-type="group" data-to="all">
              <div class="chat-item-avatar">
                <span class="avatar-text">💬</span>
              </div>
              <div class="chat-item-info">
                <div class="chat-item-name">Phòng chung</div>
                <div class="chat-item-preview">Cuộc trò chuyện chung</div>
              </div>
            </div>

            <!-- Friends list section -->
            <div class="chat-list-section">
              <div class="chat-list-section-header">Bạn bè</div>
              <div id="chatListFriends" class="chat-list-items"></div>
            </div>

            <!-- Groups list section -->
            <div class="chat-list-section">
              <div class="chat-list-section-header">Nhóm</div>
              <div id="chatListGroups" class="chat-list-items"></div>
            </div>
          </div>

          <!-- Manage section (collapsible) -->
          <div class="chat-sidebar-manage">
            <button id="btnToggleManage" class="btn small" style="width: 100%; margin-bottom: 10px;">⚙️ Quản lý</button>
            <div id="managePanel" style="display:none;">
              <div class="form-group">
                <label for="searchUser">Tìm kiếm người dùng</label>
                <input id="searchUser" placeholder="Nhập tên ..." />
                <div id="searchResults"></div>
              </div>

              <div class="form-group">
                <label>
                  Lời mời kết bạn 
                  <span id="requestsBadge" class="badge" style="display: none;">0</span>
                </label>
                <div id="requestsSection" class="requests-section">
                  <div id="friendRequests" class="list"></div>
                </div>
              </div>

              <div class="form-group">
                <label for="groupName">Tạo nhóm</label>
                <input id="groupName" placeholder="Tên nhóm" />
                <div id="memberCheckboxes" class="list"></div>
                <button id="btnCreateGroup" class="btn">Tạo nhóm</button>
                <div id="groupMessage" class="message"></div>
              </div>
            </div>
          </div>
        </aside>

        <!-- Right Side: Chat Area -->
        <div class="chat-area">
          <div class="chat-header">
            <div class="chat-header-title">
              <span id="currentChatName">Phòng chung</span>
            </div>
            <div class="status" id="sendStatus"></div>
          </div>

          <div id="messages" class="messages"></div>

          <div class="chat-input-area">
            <input id="messageInput" placeholder="Nhập tin nhắn..." autocomplete="off" />
            <button id="btnSend" class="btn primary">Gửi</button>
          </div>
        </div>
      </section>
    </main>

    <div id="notificationArea" class="notification-area"></div>
  </div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
